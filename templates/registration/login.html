{% extends 'Base.html' %}

{% block title %}Login{% endblock %}

{% block content %}

<div class="container">
    <div class="row justify-content-center align-items-center"
         style="min-height: 80vh;">

        <div class="col-md-5 col-lg-4">

            <div class="card shadow-sm border-0">

                <div class="card-body p-4">

                    <!-- Heading -->
                    <div class="text-center mb-4">
                        <h2 class="fw-bold">Welcome Back</h2>
                        <p class="text-muted">
                            Login to your medical record manager
                        </p>
                    </div>

                    <!-- Login Form -->
                    <form method="POST">

                        {% csrf_token %}

                        <!-- Username -->
                        <div class="mb-3">
                            <label for="username"
                                   class="form-label">
                                Username
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="username"
                                   name="username"
                                   placeholder="Enter your username"
                                   required>
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <label for="password"
                                   class="form-label">
                                Password
                            </label>

                            <input type="password"
                                   class="form-control"
                                   id="password"
                                   name="password"
                                   placeholder="Enter your password"
                                   required>
                        </div>

                        <!-- Error Message -->
                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-danger">
                                    {{ message }}
                                </div>
                            {% endfor %}
                        {% endif %}

                        <!-- Login Button -->
                        <div class="d-grid">
                            <button type="submit"
                                    class="btn btn-primary">
                                Login
                            </button>
                        </div>

                    </form>

                    <!-- Register -->
                    <div class="text-center mt-4">
                        <p class="mb-0 text-muted">
                            Don't have an account?
                            <a href="{% url 'register' %}">
                                Register
                            </a>
                        </p>
                    </div>

                </div>

            </div>

        </div>

    </div>
</div>

{% endblock %}
```
