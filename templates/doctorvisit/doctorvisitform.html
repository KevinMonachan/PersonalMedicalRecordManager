{% extends 'Base.html' %}

{% block title %}Add Doctor Visit{% endblock %}

{% block content %}

<div class="container py-5">

    <!-- Page Heading -->
    <div class="text-center mb-5">
        <h2 class="fw-bold">Add Doctor Visit</h2>
        <p class="text-muted">
            Enter details about your doctor visit
        </p>
    </div>


    <!-- Doctor Visit Form -->
    <div class="row justify-content-center">

        <div class="col-md-8 col-lg-7">

            <div class="card shadow-sm border-0">

                <div class="card-body p-4">

                    <form method="POST"
                          enctype="multipart/form-data">

                        {% csrf_token %}


                        <!-- Doctor Name -->
                        <div class="mb-3">

                            <label for="DoctorName"
                                   class="form-label">
                                Doctor Name
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="DoctorName"
                                   name="DoctorName"
                                   placeholder="Enter doctor name"
                                   required>

                        </div>


                        <!-- Hospital -->
                        <div class="mb-3">

                            <label for="Hospital"
                                   class="form-label">
                                Hospital / Clinic
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="Hospital"
                                   name="Hospital"
                                   placeholder="Enter hospital or clinic name"
                                   required>

                        </div>


                        <!-- Visit Date -->
                        <div class="mb-3">

                            <label for="visitDate"
                                   class="form-label">
                                Visit Date
                            </label>

                            <input type="date"
                                   class="form-control"
                                   id="visitDate"
                                   name="visitDate"
                                   required>

                        </div>


                        <!-- Reason -->
                        <div class="mb-3">

                            <label for="Reason"
                                   class="form-label">
                                Reason for Visit
                            </label>

                            <textarea class="form-control"
                                      id="Reason"
                                      name="Reason"
                                      rows="3"
                                      placeholder="Enter reason for the visit"></textarea>

                        </div>


                        <!-- Diagnosis -->
                        <div class="mb-3">

                            <label for="Diagnosis"
                                   class="form-label">
                                Diagnosis
                            </label>

                            <textarea class="form-control"
                                      id="Diagnosis"
                                      name="Diagnosis"
                                      rows="3"
                                      placeholder="Enter diagnosis"></textarea>

                        </div>


                        <!-- Prescription -->
                        <div class="mb-3">

                            <label for="Prescription"
                                   class="form-label">
                                Prescription / Medicines
                            </label>

                            <textarea class="form-control"
                                      id="Prescription"
                                      name="Prescription"
                                      rows="3"
                                      placeholder="Enter prescribed medicines"></textarea>

                        </div>


                        <!-- Notes -->
                        <div class="mb-3">

                            <label for="Notes"
                                   class="form-label">
                                Additional Notes
                            </label>

                            <textarea class="form-control"
                                      id="Notes"
                                      name="Notes"
                                      rows="3"
                                      placeholder="Any additional information"></textarea>

                        </div>


                        <!-- Result / Report -->
                        <div class="mb-4">

                            <label for="Result"
                                   class="form-label">
                                Medical Report
                            </label>

                            <input type="file"
                                   class="form-control"
                                   id="Result"
                                   name="Result">

                            <div class="form-text">
                                Upload your doctor visit report.
                            </div>

                        </div>


                        <!-- Buttons -->
                        <div class="d-flex justify-content-between">

                            <a href="{% url 'doctorvisitform' %}"
                               class="btn btn-secondary">
                                Back
                            </a>

                            <button type="submit"
                                    class="btn btn-primary">
                                Save Visit
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
