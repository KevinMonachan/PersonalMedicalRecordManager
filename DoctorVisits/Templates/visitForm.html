<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <div class="container mt-5"> <h2 class="mb-4">Add Doctor Visit</h2> 
        <form method="POST" enctype="multipart/form-data">
             {% csrf_token %}
    <div class="mb-3 row">
  <label for="doctorname" class="col-sm-2 col-form-label">Doctor Name</label>
  <div class="col-sm-10">
    <input type="text" class="form-control" id="doctorname" name="doctorname" required>
  </div>
</div>
  <div class="mb-3 row">
  <label for="hospitalname" class="col-sm-2 col-form-label">Hospital Name</label>
  <div class="col-sm-10">
    <input type="text" class="form-control" id="hospitalname" name="hospitalname" required>
  </div>
</div>
<div class="mb-3 row">
  <label for="visitdate" class="col-sm-2 col-form-label">Visit Date</label>
  <div class="col-sm-10">
    <input type="date" class="form-control" id="visitdate" name = "visitdate" required>
  </div>
</div>
<div class="mb-3 row">
  <label for="reason" class="col-sm-2 col-form-label">Reason</label>
  <div class="col-sm-10">
    <textarea class="form-control" id="reason" name="reason" rows="3"></textarea>
  </div>
</div>
<div class="mb-3 row">
  <label for="diagnosis" class="col-sm-2 col-form-label">Diagnosis</label>
  <div class="col-sm-10">
    <textarea class="form-control" id="diagnosis" name="diagnosis" rows="3"></textarea>
  </div>
</div>
<div class="mb-3 row">
  <label for="prescription" class="col-sm-2 col-form-label">Prescription</label>
  <div class="col-sm-10">
    <textarea class="form-control" id="prescription" name="prescription" rows="3"></textarea>
  </div>
</div>
<div class="mb-3 row">
  <label for="notes" class="col-sm-2 col-form-label">Notes</label>
  <div class="col-sm-10">
    <textarea  class="form-control" id="notes" name="notes" rows="3"></textarea>
  </div>
</div>
<div class="mb-3 row">
  <label for="report" class="col-sm-2 col-form-label">Report</label>
  <div class="col-sm-10">
    <input type="file" class="form-control" id="report" name="report">
  </div>
</div>
<div class="mb-3 row">
  <div class="col-sm-10">
    <button type="submit" class="btn btn-primary btn-lg">Submit</button>
  </div>
</div>
</form>
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
